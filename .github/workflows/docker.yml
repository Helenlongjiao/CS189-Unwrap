name: Publish image

on:
  push:
    branches: [CAPSTONE-main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/helenlongjiao/cs189-unwrap:latest
            ghcr.io/helenlongjiao/cs189-unwrap:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Helenlongjiao/CS189-Unwrap

      - name: Make the package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -o /tmp/visibility.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/users/Helenlongjiao/packages/container/cs189-unwrap/visibility \
            -d '{"visibility":"public"}'
          echo
          cat /tmp/visibility.json
